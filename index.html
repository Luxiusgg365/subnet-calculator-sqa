<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Subnet &amp; VLSM Lucius</title>
<style>
:root{--bg:#f6f7f9;--surface:#ffffff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--accent:#2563eb;--accent-soft:#e0e7ff;--accent-fg:#fff;--error:#dc2626;--net:#2563eb;--host:#d97706;--new:#059669;--radius:14px}
[data-theme="dark"]{--bg:#0f1115;--surface:#181b22;--border:#2a2f3a;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--accent-soft:#1e293b;--accent-fg:#0f1115;--error:#f87171;--net:#60a5fa;--host:#fbbf24;--new:#34d399}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:1.35rem;font-weight:650;margin:0;letter-spacing:-.01em}
.controls{display:flex;gap:8px;align-items:center}
select,input[type=text],button{font:inherit}
select,input[type=text]{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
select{padding:8px 10px}
button{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:#cbd5e1}[data-theme="dark"] button:hover{border-color:#3b4252}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.primary:hover{filter:brightness(1.05)}
button.ghost{background:transparent}
button.small{padding:5px 10px;font-size:.85rem;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{border:0;background:transparent;color:var(--muted);padding:8px 16px;border-radius:9px;font-weight:500}
.tab.active{background:var(--accent-soft);color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.grid.cols-3{grid-template-columns:1.2fr 1fr 1fr}.grid.cols-2{grid-template-columns:1fr 1fr}}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.mt{margin-top:12px}
.error{color:var(--error);font-size:.9rem;margin-top:8px;min-height:1.2em}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--border);background:var(--bg);color:var(--text);padding:5px 12px;border-radius:999px;font-size:.85rem;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;background:var(--accent-soft);color:var(--accent);margin-left:4px;font-weight:500}
.bit-net{color:var(--net);font-weight:600}.bit-host{color:var(--host)}.bit-new{color:var(--new);text-decoration:underline;text-decoration-thickness:2px;font-weight:700}
.legend{font-size:.82rem;color:var(--muted);margin-top:10px}
.hidden{display:none !important}
.step{margin-top:8px;padding:12px;border:1px dashed var(--border);border-radius:10px;background:var(--bg)}
.step pre{margin:0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88rem}
.bar{height:10px;background:var(--border);border-radius:999px;overflow:hidden;display:flex;margin:10px 0}
.bar-used{background:var(--accent)}.bar-free{background:var(--new);opacity:.35}
.vlsm-rows{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.vlsm-row{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center}
@media(max-width:560px){.vlsm-row{grid-template-columns:90px 1fr}.vlsm-row .rm{grid-column:1/-1;justify-self:start}}
.section-title{font-size:1rem;font-weight:600;margin:0}
.inline-opt{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);cursor:pointer;user-select:none}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);padding:6px 0}
@media print{header .controls,.chips,.actions,.no-print,button,.tabs{display:none !important}body{background:#fff}.card{border:1px solid #ccc}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appTitle">Kalkulator Subnet &amp; VLSM Lucius</h1>
    <div class="controls">
      <label><span class="sr">Tema</span><select id="themeSel" aria-label="Tema"><option value="auto">Otomatis</option><option value="light">Terang</option><option value="dark">Gelap</option></select></label>
      <label><span class="sr">Bahasa</span><select id="langSel" aria-label="Bahasa"><option value="id">ID</option><option value="en">EN</option></select></label>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab active" data-tab="subnet" role="tab" aria-selected="true" id="tabSubnet">Subnet</button>
    <button class="tab" data-tab="vlsm" role="tab" aria-selected="false" id="tabVlsm">VLSM</button>
    <button class="tab" data-tab="ipv6" role="tab" aria-selected="false" id="tabIpv6">IPv6</button>
  </div>

  <section id="panel-subnet" class="panel active" role="tabpanel">
    <div class="card">
      <div class="grid cols-3">
        <div class="field"><label for="address" id="lblAddress">Address (host/network)</label><input id="address" type="text" autocomplete="off" spellcheck="false" placeholder="192.168.1.10/24"></div>
        <div class="field"><label for="netmask" id="lblNetmask">Netmask</label><input id="netmask" type="text" autocomplete="off" spellcheck="false" placeholder="opsional"></div>
        <div class="field"><label for="netmask2" id="lblNetmask2">Pindah ke netmask</label><input id="netmask2" type="text" autocomplete="off" spellcheck="false" placeholder="opsional"></div>
      </div>
      <div class="row between mt">
        <div class="row">
          <button id="btnHitung" class="primary" type="button">Hitung</button>
          <label class="inline-opt"><input id="modeBelajar" type="checkbox"> <span id="lblBelajar">Mode Belajar</span></label>
        </div>
        <div class="actions no-print"><button id="copyLink" class="ghost small" type="button">Salin tautan</button></div>
      </div>
      <div id="errSubnet" class="error" aria-live="polite"></div>
      <div class="chips" id="chips" aria-label="Contoh"></div>
    </div>
    <div id="subnetOut"></div>
  </section>

  <section id="panel-vlsm" class="panel" role="tabpanel">
    <div class="card">
      <div class="grid cols-2">
        <div class="field"><label for="vlsmNet" id="lblVlsmNet">Network (CIDR)</label><input id="vlsmNet" type="text" value="192.168.1.0/24" autocomplete="off" spellcheck="false"></div>
        <div class="field" style="display:flex;align-items:flex-end"><div class="row"><button id="btnVlsm" class="primary" type="button">Hitung VLSM</button><button id="addNeed" type="button">+ Kebutuhan</button></div></div>
      </div>
      <div class="mt">
        <label id="lblNeeds">Kebutuhan host &amp; label (opsional)</label>
        <div id="vlsmRows" class="vlsm-rows"></div>
      </div>
      <div id="errVlsm" class="error" aria-live="polite"></div>
    </div>
    <div id="vlsmOut"></div>
  </section>

  <section id="panel-ipv6" class="panel" role="tabpanel">
    <div class="card">
      <div class="grid cols-2">
        <div class="field"><label for="v6addr" id="lblV6addr">IPv6 Address</label><input id="v6addr" type="text" value="2001:db8::1/64" autocomplete="off" spellcheck="false" placeholder="2001:db8::1/64"></div>
        <div class="field"><label for="v6prefix" id="lblV6prefix">Prefix (opsional)</label><input id="v6prefix" type="text" autocomplete="off" spellcheck="false" placeholder="64"></div>
      </div>
      <div class="row mt">
        <button id="btnV6" class="primary" type="button">Hitung IPv6</button>
      </div>
      <div id="errV6" class="error" aria-live="polite"></div>
      <div class="chips" id="chips6"></div>
    </div>
    <div id="v6Out"></div>
  </section>
</div>

<script>
(function(){
'use strict';
var I18N={
  id:{title:'Kalkulator Subnet & VLSM Lucius',subnet:'Subnet',vlsm:'VLSM',ipv6:'IPv6',address:'Address (host/network)',netmask:'Netmask',netmask2:'Pindah ke netmask',calc:'Hitung',learn:'Mode Belajar',copyLink:'Salin tautan',copyAll:'Salin semua',copy:'Salin',csv:'Ekspor CSV',result:'Hasil',div:'Pembagian Subnet',super:'Supernet',count:'Jumlah subnet',per:'Hosts/subnet',agg:'Jaringan digabung',usage:'Pemakaian ruang',remain:'Sisa alamat',vnet:'Network (CIDR)',vcalc:'Hitung VLSM',vadd:'+ Kebutuhan',vneeds:'Kebutuhan host & label (opsional)',dec:'Desimal',bin:'Biner',leg:'Legenda bit:',net:'jaringan',host:'host',newb:'bit baru subnet',theme:['Otomatis','Terang','Gelap'],empty:'Masukkan alamat untuk melihat hasil.',vempty:'Masukkan network dan kebutuhan, lalu klik Hitung VLSM.',v6empty:'Masukkan alamat IPv6 untuk melihat hasil.',range:'Range host',req:'Kebutuhan',alloc:'Alokasi',vres:'Hasil VLSM',v6res:'Hasil IPv6',v6addr:'IPv6 Address',v6pfx:'Prefix (opsional)',v6calc:'Hitung IPv6',needPh:'host',labelPh:'label (opsional)',del:'Hapus'},
  en:{title:'Subnet & VLSM Calculator Lucius',subnet:'Subnet',vlsm:'VLSM',ipv6:'IPv6',address:'Address (host/network)',netmask:'Netmask',netmask2:'Move to netmask',calc:'Calculate',learn:'Learn Mode',copyLink:'Copy link',copyAll:'Copy all',copy:'Copy',csv:'Export CSV',result:'Result',div:'Subnet Division',super:'Supernet',count:'Subnets',per:'Hosts/subnet',agg:'Aggregated networks',usage:'Address usage',remain:'Remaining',vnet:'Network (CIDR)',vcalc:'Calculate VLSM',vadd:'+ Requirement',vneeds:'Host requirements & label (optional)',dec:'Decimal',bin:'Binary',leg:'Bit legend:',net:'network',host:'host',newb:'new subnet bits',theme:['Auto','Light','Dark'],empty:'Enter an address to see results.',vempty:'Enter network and requirements, then click Calculate VLSM.',v6empty:'Enter an IPv6 address to see results.',range:'Host range',req:'Required',alloc:'Allocated',vres:'VLSM Result',v6res:'IPv6 Result',v6addr:'IPv6 Address',v6pfx:'Prefix (optional)',v6calc:'Calculate IPv6',needPh:'hosts',labelPh:'label (optional)',del:'Remove'}
};
var LANG='id', EX=['192.168.0.1/24','172.16.5.130/25','10.0.0.0/30','192.168.1.0/31','192.168.1.5/32'];
var EX6=['2001:db8::1/64','fe80::1/10','::1/128','2001:db8:abcd::/48','fd12:3456:789a::1/64'];
function $(id){return document.getElementById(id);} function t(k){return (I18N[LANG]&&I18N[LANG][k])||I18N.id[k]||k;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ipToInt(s){var p=String(s).split('.').map(Number);return ((p[0]<<24)|(p[1]<<16)|(p[2]<<8)|p[3])>>>0;}
function intToIp(n){n=n>>>0;return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');}

function applyTheme(v){var m=v;if(v==='auto'){try{m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){m='light';}}document.documentElement.setAttribute('data-theme',m);try{localStorage.setItem('theme',v);}catch(e){}}
(function(){var v='auto';try{v=localStorage.getItem('theme')||'auto';}catch(e){}$('themeSel').value=v;applyTheme(v);})();
$('themeSel').addEventListener('change',function(){applyTheme(this.value);});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if($('themeSel').value==='auto')applyTheme('auto');});}catch(e){}
(function(){try{LANG=localStorage.getItem('lang')||'id';}catch(e){LANG='id';}$('langSel').value=LANG;})();
$('langSel').addEventListener('change',function(){LANG=this.value;try{localStorage.setItem('lang',LANG);}catch(e){}applyLang();});

document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');x.setAttribute('aria-selected','false');});
  document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active');});
  b.classList.add('active');b.setAttribute('aria-selected','true');$('panel-'+b.dataset.tab).classList.add('active');
});});

function renderChips(){var c=$('chips');if(!c)return;c.innerHTML='';EX.forEach(function(ex){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=ex;b.addEventListener('click',function(){$('address').value=ex;$('netmask').value='';$('netmask2').value='';scheduleCalc();});c.appendChild(b);});}
function renderChips6(){var c=$('chips6');if(!c)return;c.innerHTML='';EX6.forEach(function(ex){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=ex;b.addEventListener('click',function(){$('v6addr').value=ex;$('v6prefix').value='';scheduleV6();});c.appendChild(b);});}

function splitBin(binStr,prefix,newBits){if(!binStr) return '-';var raw=String(binStr).replace(/\./g,'');var nb=newBits||0,out='';for(var i=0;i<32;i++){if(i>0&&i%8===0) out+='<span class="muted">.</span>';if(i===prefix) out+=' ';var cls=i<prefix?'bit-net':(nb>0&&i<prefix+nb?'bit-new':'bit-host');out+='<span class="'+cls+'">'+raw[i]+'</span>';}return out;}
function copyText(txt){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);return;}}catch(e){}var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e2){}document.body.removeChild(ta);}
function rowsToCsv(rows){return rows.map(function(r){return r.map(function(c){var s=String(c==null?'':c);if(/[",\n]/.test(s)) s='"'+s.replace(/"/g,'""')+'"';return s;}).join(',');}).join('\n');}
function downloadCsv(name,csv){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);}

var lastResult=null,lastErr=null,lastVlsm=null,lastVlsmErr=null,lastV6=null,lastV6Err=null,calcTimer=null,v6Timer=null;
function renderEmpty(){$('subnetOut').innerHTML='<div class="card"><div class="empty">'+esc(t('empty'))+'</div></div>'; }
function renderVlsmEmpty(){$('vlsmOut').innerHTML='<div class="card"><div class="empty">'+esc(t('vempty'))+'</div></div>'; }
function renderV6Empty(){$('v6Out').innerHTML='<div class="card"><div class="empty">'+esc(t('v6empty'))+'</div></div>'; }

function renderSubnet(data,err){
  $('errSubnet').textContent=err||''; if(err){$('subnetOut').innerHTML='';return;} if(!data||!data.hasil){renderEmpty();return;}
  var h=data.hasil,p=data.pembagian,pref=h.prefix,newBits=(p&&p.mode==='subnet'&&p.prefix_baru>pref)?(p.prefix_baru-pref):0;
  var addrIn=($('address').value.split('/')[0]||'').trim()||h.network;
  var rows=[['Address','ip'],['Netmask','mask'],['Wildcard','wildcard'],['Network','network'],['Broadcast','broadcast'],['HostMin','first_host'],['HostMax','last_host'],['Hosts/Net','hosts']];
  function valOf(k){if(k==='ip')return addrIn;if(k==='hosts')return h.usable_hosts+' / '+h.total_alamat;var v=h[k];return v==null?'-':v;}
  function binOf(k){if(k==='hosts')return '-';if(k==='ip')return splitBin(h.biner.ip,pref,newBits);if(k==='mask')return splitBin(h.biner.mask,pref,newBits);if(k==='wildcard')return splitBin(h.biner.wildcard,pref,newBits);if(k==='network')return splitBin(h.biner.network,pref,newBits);if(k==='broadcast')return h.biner.broadcast?splitBin(h.biner.broadcast,pref,newBits):'-';if(k==='first_host')return h.biner.first_host?splitBin(h.biner.first_host,pref,newBits):'-';if(k==='last_host')return h.biner.last_host?splitBin(h.biner.last_host,pref,newBits):'-';return '-';}
  var html='<div class="card"><div class="row between"><h2 class="section-title">'+esc(t('result'))+'</h2><div class="actions no-print"><button id="copyAll" class="small" type="button">'+esc(t('copyAll'))+'</button></div></div>';
  html+='<div class="table-wrap mt"><table><thead><tr><th>Label</th><th>'+esc(t('dec'))+'</th><th>'+esc(t('bin'))+'</th><th class="no-print"></th></tr></thead><tbody>';
  rows.forEach(function(r){var k=r[1],label=r[0];if(k==='mask') label+=' <span class="badge">/'+h.prefix+'</span>'; if(k==='network') label+=' <span class="badge">'+esc(h.kelas)+'</span> <span class="badge">'+esc(h.jenis)+'</span>';
    var dec=valOf(k),bin=binOf(k);html+='<tr><td>'+label+'</td><td class="mono">'+esc(dec)+'</td><td class="mono">'+bin+'</td><td class="no-print"><button class="small copy-row" type="button" data-dec="'+esc(dec)+'">'+esc(t('copy'))+'</button></td></tr>';});
  html+='</tbody></table></div><div class="legend">'+esc(t('leg'))+' <span class="bit-net">'+esc(t('net'))+'</span> · <span class="bit-host">'+esc(t('host'))+'</span> · <span class="bit-new">'+esc(t('newb'))+'</span></div></div>';
  if($('modeBelajar').checked){var b=h.biner;html+='<div class="card"><h2 class="section-title">'+esc(t('learn'))+'</h2><div class="step"><pre>IP        '+esc(b.ip)+'\nMask  AND '+esc(b.mask)+'\n-----------------------------------------\nNetwork   '+esc(b.network)+'  ('+esc(h.network)+')\n\nWildcard  '+esc(b.wildcard)+'\nNetwork OR Wildcard → Broadcast: '+esc(h.broadcast==null?'—':h.broadcast)+'\n\nHostMin = Network + 1   = '+esc(h.first_host==null?'—':h.first_host)+'\nHostMax = Broadcast - 1 = '+esc(h.last_host==null?'—':h.last_host)+'\nHosts = 2^(32-'+pref+') - '+(pref>=31?0:2)+' = '+h.usable_hosts+'</pre></div></div>';}
  if(p){if(p.mode==='subnet'){html+='<div class="card"><div class="row between"><h2 class="section-title">'+esc(t('div'))+'</h2><div class="actions no-print"><button id="expSubnet" class="small" type="button">'+esc(t('csv'))+'</button></div></div><p class="muted mono" style="margin:8px 0">'+esc(t('count'))+': '+p.jumlah_subnet+' · '+esc(t('per'))+': '+p.host_per_subnet+(p.terpotong?' (sebagian)':'')+'</p><div class="table-wrap"><table><thead><tr><th>#</th><th>Network</th><th>Broadcast</th><th>HostMin</th><th>HostMax</th><th>Hosts</th></tr></thead><tbody class="mono">';(p.subnet||[]).forEach(function(s){html+='<tr><td>'+s.nomor+'</td><td>'+esc(s.network_cidr)+'</td><td>'+esc(s.broadcast==null?'-':s.broadcast)+'</td><td>'+esc(s.first_host==null?'-':s.first_host)+'</td><td>'+esc(s.last_host==null?'-':s.last_host)+'</td><td>'+s.usable_hosts+'</td></tr>';});html+='</tbody></table></div></div>';} else {html+='<div class="card"><h2 class="section-title">'+esc(t('super'))+'</h2><div class="table-wrap mt"><table><tbody class="mono"><tr><th>Network</th><td>'+esc(p.network)+'/'+p.prefix_baru+'</td></tr><tr><th>Broadcast</th><td>'+esc(p.broadcast)+'</td></tr><tr><th>HostMin</th><td>'+esc(p.first_host)+'</td></tr><tr><th>HostMax</th><td>'+esc(p.last_host)+'</td></tr><tr><th>Hosts/Net</th><td>'+p.usable_hosts+'</td></tr><tr><th>'+esc(t('agg'))+'</th><td>'+p.jumlah_jaringan_digabung+'</td></tr></tbody></table></div></div>';}}
  $('subnetOut').innerHTML=html;
  document.querySelectorAll('.copy-row').forEach(function(b){b.addEventListener('click',function(){copyText(b.getAttribute('data-dec'));});});
  var ca=$('copyAll'); if(ca) ca.addEventListener('click',function(){var lines=rows.map(function(r){return r[0]+'\t'+valOf(r[1]);});copyText(lines.join('\n'));});
  var ex=$('expSubnet'); if(ex&&p&&p.mode==='subnet') ex.addEventListener('click',function(){var out=[['#','Network','Broadcast','HostMin','HostMax','Hosts']];(p.subnet||[]).forEach(function(s){out.push([s.nomor,s.network_cidr,s.broadcast,s.first_host,s.last_host,s.usable_hosts]);});downloadCsv('subnet.csv',rowsToCsv(out));});
}

function getVlsmLabels(){var labs=[];document.querySelectorAll('#vlsmRows .vlsm-row').forEach(function(r){var ins=r.querySelectorAll('input');labs.push(ins[1]?ins[1].value.trim():'');});return labs;}
function renderVlsm(data,err){
  $('errVlsm').textContent=err||''; if(err){$('vlsmOut').innerHTML='';return;} if(!data){renderVlsmEmpty();return;}
  var labels=getVlsmLabels(), totalUsed=0; data.forEach(function(r){totalUsed+=r.total_alamat;});
  var netStr=$('vlsmNet').value.trim(), parentTotal=256; try{var pp=netStr.split('/'); if(pp[1]!==undefined) parentTotal=1<<(32-parseInt(pp[1],10));}catch(e){}
  var pct=parentTotal>0?Math.min(100,(totalUsed/parentTotal)*100):0, rem=parentTotal-totalUsed;
  var remStart=null,remEnd=null; try{var last=data[data.length-1];var lb=ipToInt(last.broadcast||last.network);remStart=lb+1;var pfx=parseInt(netStr.split('/')[1],10);var mask=pfx===0?0:((~0<<(32-pfx))>>>0);var base=ipToInt(netStr.split('/')[0])&mask;remEnd=(base+parentTotal-1)>>>0;}catch(e){}
  var html='<div class="card"><div class="row between"><h2 class="section-title">'+esc(t('vres'))+'</h2><div class="actions no-print"><button id="expVlsm" class="small" type="button">'+esc(t('csv'))+'</button></div></div>';
  html+='<div class="table-wrap mt"><table><thead><tr><th>Label</th><th>'+esc(t('req'))+'</th><th>'+esc(t('alloc'))+'</th><th>Network</th><th>Mask</th><th>'+esc(t('range'))+'</th><th>Broadcast</th></tr></thead><tbody class="mono">';
  data.forEach(function(r,i){var range=(r.first_host&&r.last_host)?(r.first_host+' - '+r.last_host):'-';html+='<tr><td>'+esc(labels[i]||'')+'</td><td>'+r.kebutuhan+'</td><td>/'+r.prefix+' ('+r.usable_hosts+')</td><td>'+esc(r.network_cidr)+'</td><td>'+esc(r.mask)+'</td><td>'+esc(range)+'</td><td>'+esc(r.broadcast==null?'-':r.broadcast)+'</td></tr>';});
  html+='</tbody></table></div><div class="muted" style="margin-top:10px;font-size:.9rem">'+esc(t('usage'))+'</div><div class="bar" aria-label="usage"><div class="bar-used" style="width:'+pct.toFixed(2)+'%"></div><div class="bar-free" style="width:'+Math.max(0,100-pct).toFixed(2)+'%"></div></div>';
  if(rem>0 && remStart!==null && remEnd!==null && remStart<=remEnd){html+='<div class="mono muted" style="font-size:.9rem">'+esc(t('remain'))+': '+esc(intToIp(remStart))+' - '+esc(intToIp(remEnd))+' ('+rem+' · '+((rem/parentTotal)*100).toFixed(1)+'%)</div>';} else {html+='<div class="mono muted" style="font-size:.9rem">'+esc(t('remain'))+': 0</div>';}
  html+='</div>';$('vlsmOut').innerHTML=html;
  var ex=$('expVlsm'); if(ex) ex.addEventListener('click',function(){var out=[['Label','Kebutuhan','Network','Mask','HostMin','HostMax','Broadcast','Usable']];data.forEach(function(r,i){out.push([labels[i]||'',r.kebutuhan,r.network_cidr,r.mask,r.first_host,r.last_host,r.broadcast,r.usable_hosts]);});downloadCsv('vlsm.csv',rowsToCsv(out));});
}

function renderV6(data,err){
  $('errV6').textContent=err||''; if(err){$('v6Out').innerHTML='';return;} if(!data){renderV6Empty();return;}
  var rows=[['Address (compressed)',data.address],['Address (expanded)',data.address_expanded],['Prefix','/'+data.prefix],['Network',data.network_cidr],['Range start',data.first_address],['Range end',data.last_address],['Total addresses',data.total_addresses],['Type',data.jenis]];
  var html='<div class="card"><div class="row between"><h2 class="section-title">'+esc(t('v6res'))+'</h2><div class="actions no-print"><button id="copyV6" class="small" type="button">'+esc(t('copyAll'))+'</button></div></div>';
  html+='<div class="table-wrap mt"><table><tbody class="mono">';
  rows.forEach(function(r){html+='<tr><th style="width:220px">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>';});
  html+='</tbody></table></div></div>';
  $('v6Out').innerHTML=html;
  var cv=$('copyV6'); if(cv) cv.addEventListener('click',function(){copyText(rows.map(function(r){return r[0]+': '+r[1];}).join('\n'));});
}

function updateQS(){var a=$('address').value.trim(),m=$('netmask').value.trim(),m2=$('netmask2').value.trim();var p=new URLSearchParams();if(a)p.set('a',a);if(m)p.set('m',m);if(m2)p.set('m2',m2);var qs=p.toString();try{history.replaceState(null,'',location.pathname+(qs?'?'+qs:''));}catch(e){}}
function loadQS(){var p=new URLSearchParams(location.search);if(p.has('a'))$('address').value=p.get('a');if(p.has('m'))$('netmask').value=p.get('m');if(p.has('m2'))$('netmask2').value=p.get('m2');}

async function doCalc(){var a=$('address').value.trim(),m=$('netmask').value.trim(),m2=$('netmask2').value.trim();if(!a){lastResult=null;lastErr=null;$('errSubnet').textContent='';renderEmpty();updateQS();return;}var url='/api/ipcalc?address='+encodeURIComponent(a);if(m) url+='&netmask='+encodeURIComponent(m);if(m2) url+='&netmask2='+encodeURIComponent(m2);try{var r=await fetch(url,{cache:'no-store'});var d=await r.json();if(!r.ok){lastResult=null;lastErr=(d&&d.detail)?d.detail:('Error '+r.status);renderSubnet(null,lastErr);}else{lastResult=d;lastErr=null;renderSubnet(d,null);} }catch(e){lastResult=null;lastErr='Gagal menghubungi server';renderSubnet(null,lastErr);}updateQS();}
function scheduleCalc(){clearTimeout(calcTimer);calcTimer=setTimeout(doCalc,250);}
$('btnHitung').addEventListener('click',doCalc);
['address','netmask','netmask2'].forEach(function(id){$(id).addEventListener('input',scheduleCalc);$(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doCalc();}});});
$('modeBelajar').addEventListener('change',function(){if(lastResult)renderSubnet(lastResult,lastErr);});
$('copyLink').addEventListener('click',function(){copyText(location.href);});

async function doV6(){var a=$('v6addr').value.trim(),p=$('v6prefix').value.trim();if(!a){lastV6=null;lastV6Err=null;$('errV6').textContent='';renderV6Empty();return;}var url='/api/ipv6?address='+encodeURIComponent(a);if(p) url+='&prefix='+encodeURIComponent(p);try{var r=await fetch(url,{cache:'no-store'});var d=await r.json();if(!r.ok){lastV6=null;lastV6Err=(d&&d.detail)?d.detail:('Error '+r.status);renderV6(null,lastV6Err);}else{lastV6=d;lastV6Err=null;renderV6(d,null);} }catch(e){lastV6=null;lastV6Err='Gagal menghubungi server';renderV6(null,lastV6Err);}}
function scheduleV6(){clearTimeout(v6Timer);v6Timer=setTimeout(doV6,250);}
$('btnV6').addEventListener('click',doV6);
['v6addr','v6prefix'].forEach(function(id){$(id).addEventListener('input',scheduleV6);$(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doV6();}});});

function addVlsmRow(req,label){var row=document.createElement('div');row.className='vlsm-row';row.innerHTML='<input type="text" value="'+esc(req||'')+'" aria-label="Kebutuhan host" placeholder="'+esc(t('needPh'))+'"><input type="text" value="'+esc(label||'')+'" aria-label="Label" placeholder="'+esc(t('labelPh'))+'"><button type="button" class="small rm">'+esc(t('del'))+'</button>';row.querySelector('.rm').addEventListener('click',function(){row.remove();});row.querySelectorAll('input').forEach(function(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doVlsm();}});});$('vlsmRows').appendChild(row);}
$('addNeed').addEventListener('click',function(){addVlsmRow('','');});
function collectVlsm(){var net=$('vlsmNet').value.trim(),kebutuhan=[];document.querySelectorAll('#vlsmRows .vlsm-row').forEach(function(r){var ins=r.querySelectorAll('input');var v=(ins[0].value||'').trim();if(v==='') return;var n=parseInt(v,10);kebutuhan.push(String(n)===v?n:v);});return {network:net,kebutuhan_host:kebutuhan};}
async function doVlsm(){var body=collectVlsm();$('btnVlsm').disabled=true;try{var r=await fetch('/api/vlsm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json();if(!r.ok){lastVlsm=null;lastVlsmErr=(d&&d.detail)?d.detail:('Error '+r.status);renderVlsm(null,lastVlsmErr);}else{lastVlsm=d;lastVlsmErr=null;renderVlsm(d,null);} }catch(e){lastVlsm=null;lastVlsmErr='Gagal menghubungi server';renderVlsm(null,lastVlsmErr);}finally{$('btnVlsm').disabled=false;}}
$('btnVlsm').addEventListener('click',doVlsm);$('vlsmNet').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doVlsm();}});

function applyLang(){ $('appTitle').textContent=t('title'); $('tabSubnet').textContent=t('subnet'); $('tabVlsm').textContent=t('vlsm'); $('tabIpv6').textContent=t('ipv6'); $('lblAddress').textContent=t('address'); $('lblNetmask').textContent=t('netmask'); $('lblNetmask2').textContent=t('netmask2'); $('btnHitung').textContent=t('calc'); $('lblBelajar').textContent=t('learn'); $('copyLink').textContent=t('copyLink'); $('lblVlsmNet').textContent=t('vnet'); $('btnVlsm').textContent=t('vcalc'); $('addNeed').textContent=t('vadd'); $('lblNeeds').textContent=t('vneeds'); $('lblV6addr').textContent=t('v6addr'); $('lblV6prefix').textContent=t('v6pfx'); $('btnV6').textContent=t('v6calc'); var ts=$('themeSel').options;ts[0].text=t('theme')[0];ts[1].text=t('theme')[1];ts[2].text=t('theme')[2]; document.querySelectorAll('#vlsmRows .vlsm-row').forEach(function(r){var ins=r.querySelectorAll('input');if(ins[0])ins[0].placeholder=t('needPh');if(ins[1])ins[1].placeholder=t('labelPh');var rm=r.querySelector('.rm');if(rm)rm.textContent=t('del');}); renderChips(); renderChips6(); if(lastResult)renderSubnet(lastResult,lastErr); else renderEmpty(); if(lastVlsm||lastVlsmErr)renderVlsm(lastVlsm,lastVlsmErr); else renderVlsmEmpty(); if(lastV6||lastV6Err)renderV6(lastV6,lastV6Err); else renderV6Empty(); }

// init
renderChips(); renderChips6(); applyLang();
[['100','LAN Guru'],['50','LAN Siswa'],['20','Lab'],['2','Link']].forEach(function(x){addVlsmRow(x[0],x[1]);});
loadQS(); if(!$('address').value) $('address').value='172.16.5.130/25';
doCalc(); doVlsm(); doV6();

// live reload dev
(function(){var last=null,stopped=false;async function cek(){if(stopped)return;try{var r=await fetch('/__dev/versi',{cache:'no-store'});if(r.status===404){stopped=true;return;}if(!r.ok)return;var d=await r.json();if(last!==null&&d.versi!==last){location.reload();return;}last=d.versi;}catch(e){}}cek();setInterval(cek,1000);})();
})();
</script>
